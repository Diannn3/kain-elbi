name: UPPETITE Release Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      TZ: Asia/Manila
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Build-size gate
        run: npm run audit:build-size

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Functional E2E
        run: npm run test:e2e

      - name: Performance gate
        run: npm run test:perf

      - name: Visual regression gate
        if: ${{ hashFiles('app/tests/e2e/visual.spec.ts-snapshots/**') != '' }}
        run: npm run test:visual

      - name: Explain missing visual baseline
        if: ${{ hashFiles('app/tests/e2e/visual.spec.ts-snapshots/**') == '' }}
        run: echo "Visual test spec is installed; run npm run test:visual:update on the CI-matching environment and commit the generated baselines to activate this gate."

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failures
          if-no-files-found: ignore
          path: |
            app/test-results
            app/playwright-report
